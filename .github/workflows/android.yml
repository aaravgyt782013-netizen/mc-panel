name: Android build
on:
  push:
  pull_request:
concurrency:
  group: jarvis-android-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Bundle and validate Vosk model layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets /tmp/vosk-model-extract
          curl -fL --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o /tmp/vosk-model.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model-extract
          UUID_FILE="$(find /tmp/vosk-model-extract -type f -name uuid -print -quit)"
          test -n "$UUID_FILE" || { echo "ERROR: Vosk archive has no uuid file"; exit 1; }
          MODEL_DIR="$(dirname "$UUID_FILE")"
          test -f "$MODEL_DIR/README" -o -d "$MODEL_DIR/am" -o -d "$MODEL_DIR/conf" || { echo "ERROR: Vosk model files missing beside uuid"; exit 1; }
          rm -f app/src/main/assets/model-en-us.zip
          (cd "$MODEL_DIR" && zip -qr "$GITHUB_WORKSPACE/app/src/main/assets/model-en-us.zip" .)
          unzip -Z1 app/src/main/assets/model-en-us.zip | grep -qx 'uuid' || { echo "ERROR: uuid is not at the archive root"; exit 1; }
          unzip -Z1 app/src/main/assets/model-en-us.zip | grep -q '^am/' || { echo "ERROR: model am/ directory missing at archive root"; exit 1; }
          unzip -Z1 app/src/main/assets/model-en-us.zip | grep -q '^conf/' || { echo "ERROR: model conf/ directory missing at archive root"; exit 1; }
          echo "Validated Vosk model archive root:"
          unzip -Z1 app/src/main/assets/model-en-us.zip | head -20
          du -h app/src/main/assets/model-en-us.zip
      - name: Build debug and release APKs
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug assembleRelease
      - name: Verify debug APK signing
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --print-certs "$APK"
      - name: Prepare downloadable bundles
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/JARVIS-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/JARVIS-release-unsigned.apk
          (cd artifacts && zip -q JARVIS-debug.zip JARVIS-debug.apk && zip -q JARVIS-release-unsigned.zip JARVIS-release-unsigned.apk)
      - name: Upload debug APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: |
            artifacts/JARVIS-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Print debug APK size and SHA-256
        run: |
          APK="artifacts/JARVIS-debug.apk"
          echo "Debug APK size: $(stat -c '%s bytes' "$APK")"
          sha256sum "$APK"
      - name: Upload unsigned release APK option
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-unsigned-apk-and-zip
          path: |
            artifacts/JARVIS-release-unsigned.apk
            artifacts/JARVIS-release-unsigned.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest-debug prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          target_commitish: jarvis-rebuild
          name: JARVIS latest debug build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: artifacts/JARVIS-debug.apk
