name: Generate package lockfile

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Generate lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; nothing to do."
            exit 0
          fi
          npm install --package-lock-only
      - name: Commit lockfile
        run: |
          if [ -f package-lock.json ] && git status --short -- package-lock.json | grep -q '^'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add package lockfile"
            git push origin HEAD:dev
          else
            echo "No new package-lock.json to commit."
          fi
